<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<nav class="navbar"><div class="brand">Placement<span>Hub</span></div><div><span>Administrator</span><button class="logout" onclick="logout()">Logout</button></div></nav>
<main class="dashboard">
<div class="page-head"><div><p class="eyebrow">ADMINISTRATION</p><h1>Placement Management</h1></div></div>
<section class="stats" id="stats"></section>
<div class="two-col">
<section class="panel"><h2>Add Company</h2>
<form id="companyForm" class="grid-form">
<label>Company Name<input id="cname" required></label><label>Job Role<input id="role" required></label>
<label class="span2">Description<input id="desc"></label>
<label>Minimum CGPA<input id="mincgpa" type="number" step="0.1" min="0" max="10" required></label>
<label>Required Skills<input id="reqskills" placeholder="Java,SQL,DSA"></label>
<label>Required Training<input id="reqtraining" placeholder="None"></label>
<label>Required Internship<input id="reqinternship" placeholder="None"></label>
<label>Location<input id="location" placeholder="Hyderabad"></label><label>Package<input id="package" placeholder="6 LPA"></label>
<label>Deadline<input id="deadline" placeholder="30-09-2026"></label>
</form><button class="btn btn-primary" onclick="addCompany()">Add Company</button><p id="companyMsg" class="message"></p>
</section>
<section class="panel"><h2>Company Management</h2><div id="companyList"></div></section>
</div>
<section class="panel"><h2>Student Management</h2><div class="search-row"><input id="studentSearch" placeholder="Search by ID, name or skill" oninput="loadStudents()"><input id="minFilter" type="number" step="0.1" placeholder="Minimum CGPA"><button class="btn btn-outline" onclick="loadStudents()">Filter</button></div><div id="studentList"></div></section>
<section class="panel"><h2>Candidate Matching</h2><select id="companySelect"></select><button class="btn btn-primary" onclick="matchCandidates()">Find Matching Candidates</button><div id="matchResults"></div></section>
<section class="panel"><h2>Applications</h2><select id="applicationFilter" onchange="loadApplications()"><option value="">All</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>SHORTLISTED</option><option>INTERVIEW</option><option>SELECTED</option><option>NOT_SELECTED</option></select><div id="applicationList"></div></section>
<section class="panel"><h2>Placement Drive</h2><form id="driveForm" class="grid-form"><label>Company<input id="driveCompany" required></label><label>Role<input id="driveRole" required></label><label>Date<input id="driveDate" required></label><label>Venue<input id="driveVenue" required></label><label>Openings<input id="driveOpenings" type="number" required></label><label>Deadline<input id="driveDeadline" required></label><label class="span2">Requirements<input id="driveRequirements"></label></form><button class="btn btn-primary" onclick="addDrive()">Create Drive</button><div id="driveList"></div></section>
</main>
<script src="/js/admin.js"></script>
</body>
</html>
